<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — Market Intelligence Dashboard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#0a0e17; --panel:#111827; --line:#1f2a3d; --ink:#e6edf7; --dim:#64748b; --up:#22c55e; --down:#ef4444; --accent:#38bdf8; }
  body { background:var(--bg); color:var(--ink); font-family:'Segoe UI', system-ui, sans-serif; }
  .shell { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
  aside { border-right:1px solid var(--line); padding:26px 18px; display:flex; flex-direction:column; gap:6px; background:#0c1220; }
  .brand { font-size:20px; font-weight:800; letter-spacing:1px; padding:0 10px 24px; }
  .brand span { color:var(--accent); }
  .navitem { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; color:var(--dim); text-decoration:none; font-size:14px; transition:.2s; }
  .navitem:hover, .navitem.on { background:rgba(56,189,248,.1); color:var(--ink); }
  .navitem.on { box-shadow:inset 2px 0 0 var(--accent); }
  main { padding:30px 34px; overflow-x:hidden; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; flex-wrap:wrap; gap:14px; }
  .topbar h1 { font-size:24px; font-weight:700; }
  .search { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; color:var(--dim); font-size:13px; width:260px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:22px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .card .lbl { color:var(--dim); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  .card .val { font-size:26px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; }
  .delta { font-size:13px; margin-top:6px; font-weight:600; }
  .delta.up { color:var(--up); } .delta.down { color:var(--down); }
  .grid { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .panel h3 { font-size:15px; margin-bottom:16px; color:#c7d2e3; }
  #chart { width:100%; height:280px; display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--dim); font-weight:600; font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:10px 8px; border-bottom:1px solid var(--line); }
  td { padding:12px 8px; border-bottom:1px solid rgba(31,42,61,.6); font-variant-numeric:tabular-nums; }
  .sym { font-weight:700; }
  .pill { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
  .pill.up { background:rgba(34,197,94,.14); color:var(--up); }
  .pill.down { background:rgba(239,68,68,.14); color:var(--down); }
  .spark { width:80px; height:26px; }
  .live { display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--dim); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--up); animation:blink 1.4s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  @media (max-width:900px){ .shell{grid-template-columns:1fr;} aside{flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line);} .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">PULSE<span>.</span></div>
    <a class="navitem on" href="#">▤ &nbsp;Overview</a>
    <a class="navitem" href="#">◫ &nbsp;Portfolio</a>
    <a class="navitem" href="#">◈ &nbsp;Markets</a>
    <a class="navitem" href="#">◉ &nbsp;Alerts</a>
    <a class="navitem" href="#">⚙ &nbsp;Settings</a>
  </aside>
  <main>
    <div class="topbar">
      <div><h1>Market Overview</h1><span class="live"><span class="dot"></span> Live feed · updates every 2s</span></div>
      <input class="search" placeholder="Search assets…">
    </div>
    <div class="cards" id="cards"></div>
    <div class="grid">
      <div class="panel">
        <h3>Portfolio Performance — 30 days</h3>
        <canvas id="chart"></canvas>
      </div>
      <div class="panel">
        <h3>Top Movers</h3>
        <table id="movers">
          <thead><tr><th>Asset</th><th>Price</th><th>24h</th><th>Trend</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script>
  const fmt = (n,d=2) => n.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
  const assets = [
    {sym:'BTC/USD', price:97420, chg:2.4},
    {sym:'ETH/USD', price:3612, chg:1.1},
    {sym:'SOL/USD', price:214.6, chg:-0.8},
    {sym:'AAPL', price:231.4, chg:0.6},
    {sym:'GOLD', price:2652, chg:-0.2},
  ];
  const hist = {}; assets.forEach(a => { hist[a.sym] = Array.from({length:30},(_,i)=> a.price*(1+Math.sin(i/4)*0.03+(Math.random()-0.5)*0.02)); hist[a.sym].push(a.price); });

  // Stat cards
  const cardsEl = document.getElementById('cards');
  function renderCards(){
    const total = 128450 + (Math.random()-0.5)*300;
    const data = [
      {lbl:'Portfolio value', val:'$'+fmt(total), d:+1.84},
      {lbl:'24h P&L', val:(total*0.0184/100*100).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}), d:+1.84},
      {lbl:'Open positions', val:'12', d:-2.10},
      {lbl:'Cash available', val:'$18,220', d:+0.42},
    ];
    cardsEl.innerHTML = data.map(c=>`
      <div class="card"><div class="lbl">${c.lbl}</div><div class="val">${c.val}</div>
      <div class="delta ${c.d>=0?'up':'down'}">${c.d>=0?'▲':'▼'} ${Math.abs(c.d)}% today</div></div>`).join('');
  }
  renderCards();

  // Main chart
  const cv = document.getElementById('chart'), ctx = cv.getContext('2d');
  function drawChart(){
    const dpr = devicePixelRatio||1;
    cv.width = cv.clientWidth*dpr; cv.height = cv.clientHeight*dpr; ctx.scale(dpr,dpr);
    const W = cv.clientWidth, H = cv.clientHeight, pad = 8;
    const series = hist['BTC/USD'];
    const min = Math.min(...series)*0.998, max = Math.max(...series)*1.002;
    ctx.clearRect(0,0,W,H);
    // grid
    ctx.strokeStyle = 'rgba(100,116,139,.15)'; ctx.lineWidth = 1;
    for(let i=1;i<5;i++){ const y = H*i/5; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    const pts = series.map((v,i)=>[i/(series.length-1)*W, H-pad-(v-min)/(max-min)*(H-2*pad)]);
    // area
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'rgba(56,189,248,.35)'); grad.addColorStop(1,'rgba(56,189,248,0)');
    ctx.beginPath(); ctx.moveTo(pts[0][0],H); pts.forEach(p=>ctx.lineTo(p[0],p[1])); ctx.lineTo(W,H); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    // line
    ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
    // last point
    const lp = pts[pts.length-1];
    ctx.beginPath(); ctx.arc(lp[0],lp[1],4,0,7); ctx.fillStyle='#38bdf8'; ctx.fill();
  }

  // Movers table
  function sparkline(sym, up){
    const data = hist[sym].slice(-14);
    const min = Math.min(...data), max = Math.max(...data);
    const pts = data.map((v,i)=>`${(i/(data.length-1)*80).toFixed(1)},${(24-(v-min)/(max-min)*22).toFixed(1)}`).join(' ');
    return `<svg class="spark"><polyline points="${pts}" fill="none" stroke="${up?'#22c55e':'#ef4444'}" stroke-width="1.6"/></svg>`;
  }
  function renderMovers(){
    const tb = document.querySelector('#movers tbody');
    tb.innerHTML = assets.map(a=>{
      const jitter = 1+(Math.random()-0.5)*0.004;
      a.price *= jitter;
      hist[a.sym].push(a.price); hist[a.sym].shift();
      const up = a.chg>=0;
      return `<tr><td class="sym">${a.sym}</td><td>$${fmt(a.price)}</td>
        <td><span class="pill ${up?'up':'down'}">${up?'+':''}${a.chg}%</span></td>
        <td>${sparkline(a.sym, up)}</td></tr>`;
    }).join('');
  }
  renderMovers(); drawChart();
  setInterval(()=>{ renderCards(); renderMovers(); drawChart(); }, 2000);
  addEventListener('resize', drawChart);
</script>
</body>
</html>
